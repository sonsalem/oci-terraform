# OKE already ships an "oci-bv" class. This one just pins the performance tier.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oci-bv-balanced
provisioner: blockvolume.csi.oraclecloud.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  vpusPerGB: "10" # 0 = lower cost, 10 = balanced, 20 = higher performance
