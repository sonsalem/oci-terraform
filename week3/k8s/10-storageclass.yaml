# OKE ships a default "oci-bv" StorageClass backed by the OCI Block
# Volume CSI driver. This custom one is provided in case you want to
# control the volume performance tier explicitly (Balanced here).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: oci-bv-balanced
provisioner: blockvolume.csi.oraclecloud.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  vpusPerGB: "10" # 10 = Balanced, 0 = Lower Cost, 20 = Higher Performance
