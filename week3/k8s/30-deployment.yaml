apiVersion: apps/v1
kind: Deployment
metadata:
  name: week3-app
  namespace: week3-lab
  labels:
    app: week3-app
spec:
  # A block volume attaches to one node at a time, so this stays at 1 replica.
  # If you need several pods sharing the files, that's File Storage, not block.
  replicas: 1
  strategy:
    type: Recreate # old pod has to release the volume before the new one gets it
  selector:
    matchLabels:
      app: week3-app
  template:
    metadata:
      labels:
        app: week3-app
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: app-data
              mountPath: /usr/share/nginx/html/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data-pvc
